<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignSense — Exercise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B;
    --ink-2:#16263C;
    --ink-soft:#3B4A5F;
    --muted:#7D8CA1;
    --page:#E9EDF2;
    --card:#FFFFFF;
    --line:#D2DAE4;
    --amber:#E8930C;
    --green:#0E9C6A;
    --green-soft:#E4F4EE;
    --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,sans-serif;
    --util:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--page);color:var(--ink);
    font-family:var(--body);-webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1080px;margin:0 auto;padding:0 28px 56px}
  .eyebrow{
    font-family:var(--util);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin:0;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0}
  .back{
    display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0;
    font-family:var(--body);font-size:13.5px;font-weight:500;color:var(--ink-soft);
  }
  .back svg{display:block}
  .where{text-align:center}
  .where .lesson{
    font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em;margin:2px 0 0;
  }
  .steps{display:flex;align-items:center;gap:5px}
  .step{width:22px;height:4px;border-radius:99px;background:var(--line)}
  .step.done{background:var(--green)}
  .step.now{background:var(--ink)}

  /* ---------- sentence strip ---------- */
  .sentence{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .gloss{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .word{
    font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em;
    padding:6px 12px;border-radius:4px;display:flex;align-items:center;gap:8px;
  }
  .word.done{color:var(--green);background:var(--green-soft)}
  .word.now{color:#fff;background:var(--ink)}
  .word.next{color:var(--muted);background:var(--page)}
  .word svg{display:block}
  .sentence .meaning{font-size:13px;color:var(--muted);margin-left:auto}

  /* ---------- panels ---------- */
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px 12px;
  }
  .stage{background:var(--ink);position:relative;aspect-ratio:4/5;display:flex;justify-content:center}
  .stage img{display:block;height:100%;width:100%;object-fit:cover}

  .paused{
    position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:7px;
    background:rgba(14,26,43,.82);color:#fff;border-radius:3px;padding:6px 10px;
    font-family:var(--util);font-size:10px;letter-spacing:.14em;
  }
  .timeline{padding:14px 18px 18px}
  .track{display:flex;gap:3px;align-items:center}
  .seg{height:6px;border-radius:99px;background:var(--line);flex:1}
  .seg.played{background:var(--ink)}
  .marker{width:2px;height:14px;background:var(--amber);border-radius:99px;flex:none}
  .track-note{
    display:flex;justify-content:space-between;gap:12px;margin-top:9px;
    font-size:12px;color:var(--muted);
  }

  /* camera side */
  .cam-stage{position:relative;background:var(--ink-2)}
  .cam-inner{position:relative;height:100%;aspect-ratio:1/1}
  .cam-inner img{display:block;width:100%;height:100%;object-fit:cover}
  .overlay{position:absolute;inset:0;width:100%;height:100%}
  .lm-line{stroke:#3BE8B0;stroke-width:2.6;stroke-linecap:round;fill:none;opacity:.9}
  .lm-dot{fill:#FFFFFF;stroke:#0E9C6A;stroke-width:1.6}

  .corner{position:absolute;width:30px;height:30px;border:3px solid var(--green)}
  .c-tl{top:12px;left:12px;border-right:0;border-bottom:0}
  .c-tr{top:12px;right:12px;border-left:0;border-bottom:0}
  .c-bl{bottom:12px;left:12px;border-right:0;border-top:0}
  .c-br{bottom:12px;right:12px;border-left:0;border-top:0}

  .verdict{
    position:absolute;left:0;right:0;bottom:0;background:var(--green);color:#fff;
    display:flex;align-items:center;gap:10px;padding:13px 18px;
  }
  .verdict-mark{
    width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);
    display:grid;place-items:center;flex:none;
  }
  .verdict strong{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}
  .verdict span{font-size:13px;color:rgba(255,255,255,.85)}

  .cam-foot{padding:14px 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
  .privacy{font-size:12px;color:var(--muted)}

  @media (max-width:820px){
    .panels{grid-template-columns:1fr}
    .sentence .meaning{margin-left:0;width:100%}
  }
</style>
</head>
