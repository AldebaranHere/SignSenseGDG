<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SignSense Login</title> 
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <h1>SignSense Login</h1>
        <p class="sub">Login to access your SignSense account.</p>
        <form id="signinForm">
            <div class="input-row">
                <img src="man.png" alt="Man Icon">
                <input type="text" name="username" id="username-input" placeholder="Username" required>
            </div>
            <div class="input-row">
                <img src="lock.png" alt="Lock Icon">
                <input type="password" name="password" id="password-input" placeholder="Password" required>
            </div>
            <div class="input-row">
                <button type="submit">Login</button>
            </div>   
        </form>
        <p>Don't have an account? <a href="signup.html">Sign up here</a></p>

        <script>
            document.getElementById('signinForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const username = document.getElementById('username-input').value.trim();
                const password = document.getElementById('password-input').value;

                let users = JSON.parse(localStorage.getItem('users')) || {};

                if (users[username] && users[username].password === password) {
                    sessionStorage.setItem('loggedInUser', username);
                    window.location.href = 'mainmenu.html';
                } else {
                    alert('Invalid username or password. Not authorized.');
                }
            });
        </script>
    </body>
</html>
