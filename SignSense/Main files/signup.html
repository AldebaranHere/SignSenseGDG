<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SignSense Signup</title> 
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <h1>SignSense Signup</h1>
        <p class="sub">Sign up to start using SignSense.</p>
        <form id="signupForm">
            <div class="input-row">
                <img src="man.png" alt="Man Icon">
                <input type="text" name="username" id="username-input" placeholder="Username" required>
            </div>
           <div class="input-row">
                <label for="email-input">
                <span>@</span>
                </label>
                <input type="email" name="email" id="email-input" placeholder="Email" required>
            </div>
            <div class="input-row">
                <img src="lock.png" alt="Lock Icon">
                <input type="password" name="password" id="password-input" placeholder="Password" required>
            </div>
            <div class="input-row">
                <button type="submit">Sign up</button>
            </div>   
        </form>
        <p>Already have an account? <a href="index.html">Login here</a></p>

        <script>
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const username = document.getElementById('username-input').value.trim();
                const email = document.getElementById('email-input').value.trim();
                const password = document.getElementById('password-input').value;

                let users = JSON.parse(localStorage.getItem('users')) || {};

                if (users[username]) {
                    alert('That username is already taken.');
                    return;
                }

                users[username] = { email: email, password: password }; // NOTE: plain text, demo only
                localStorage.setItem('users', JSON.stringify(users));

                alert('Account created! Please sign in.');
                window.location.href = 'index.html';
            });
        </script>
    </body>
</html>
